<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" role="img" aria-label="Diagram of an entity-resolution workflow: passages from sources in two scripts produce candidate links, one resolved entity, a verbatim quote, and a human adjudication step.">
  <rect width="320" height="150" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <g fill="none" stroke="#c3cbd4" stroke-width="1.2">
      <path d="M100 46C122 46 124 68 141 70"/>
      <path d="M100 104C122 104 124 82 141 80"/>
      <path d="M187 75H213"/>
    </g>
    <g>
      <rect x="12" y="26" width="88" height="40" rx="7" fill="#f8f8f5" stroke="#d6dce3"/>
      <text x="21" y="40" font-size="7" letter-spacing="1" fill="#5b6470">SOURCE A</text>
      <rect x="63" y="46" width="28" height="3" rx="1.5" fill="#a66a2c"/>
      <rect x="39" y="53" width="52" height="3" rx="1.5" fill="#dde2e8"/>
      <rect x="51" y="59" width="40" height="3" rx="1.5" fill="#dde2e8"/>
    </g>
    <g>
      <rect x="12" y="84" width="88" height="40" rx="7" fill="#f8f8f5" stroke="#d6dce3"/>
      <text x="21" y="98" font-size="7" letter-spacing="1" fill="#5b6470">SOURCE B</text>
      <rect x="21" y="104" width="30" height="3" rx="1.5" fill="#a66a2c"/>
      <rect x="21" y="111" width="54" height="3" rx="1.5" fill="#dde2e8"/>
      <rect x="21" y="117" width="42" height="3" rx="1.5" fill="#dde2e8"/>
    </g>
    <circle cx="164" cy="75" r="23" fill="#17324d"/>
    <text x="164" y="73" text-anchor="middle" font-size="8" letter-spacing=".6" fill="#ffffff">ENTITY</text>
    <text x="164" y="84" text-anchor="middle" font-size="6.5" letter-spacing=".4" fill="#9fb0c1">RESOLVED</text>
    <g>
      <rect x="214" y="52" width="94" height="46" rx="7" fill="#ffffff" stroke="#d6dce3"/>
      <text x="223" y="66" font-size="7" letter-spacing="1" fill="#5b6470">VERBATIM QUOTE</text>
      <rect x="223" y="72" width="3" height="18" rx="1.5" fill="#17324d"/>
      <rect x="231" y="73" width="66" height="3" rx="1.5" fill="#dde2e8"/>
      <rect x="231" y="80" width="52" height="3" rx="1.5" fill="#dde2e8"/>
      <rect x="231" y="87" width="38" height="3" rx="1.5" fill="#dde2e8"/>
    </g>
    <g>
      <circle cx="22" cy="140" r="6" fill="none" stroke="#a66a2c" stroke-width="1.2"/>
      <path d="M19.4 140.2l1.9 1.9 3.4-3.8" fill="none" stroke="#a66a2c" stroke-width="1.4" stroke-linecap="round"/>
      <text x="34" y="143" font-size="8" fill="#5b6470">A historian adjudicates every candidate link</text>
    </g>
  </g>
</svg>

