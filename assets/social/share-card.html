<!DOCTYPE html>
<!-- Source for share-card.jpg (1200x630), the image shown in link previews.
     To regenerate: open this file at 1200x630 in a browser and take a screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card source</title>
<style>
@font-face {
  font-family: "Literata";
  font-weight: 400 700;
  src: url(../fonts/literata/v40-or3aQ6P12-iJxAIgLa78DkrbXsDgk0oVDaDPYLanFLHpPf2TbBG_df3-vbgKBM6YoggA-vpO-7cHM524.woff2) format("woff2");
}
@font-face {
  font-family: "IBM Plex Sans";
  font-weight: 400 700;
  src: url(../fonts/ibm-plex-sans/v23-zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYbSB4Zh.woff2) format("woff2");
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  display: grid;
  grid-template-columns: 630px 1fr;
  background: #f8f8f5;
  color: #1f2933;
  font-family: "IBM Plex Sans", sans-serif;
}
.photo { width: 630px; height: 630px; object-fit: cover; display: block; }
.panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 60px 0 56px;
  border-left: 6px solid #17324d;
}
.kicker {
  color: #a66a2c;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
h1 {
  margin-top: 18px;
  font-family: "Literata", serif;
  font-size: 74px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.035em;
}
.rule { width: 72px; height: 3px; margin: 30px 0 26px; background: #a66a2c; }
.subtitle {
  color: #17324d;
  font-family: "Literata", serif;
  font-size: 31px;
  font-weight: 600;
  line-height: 1.2;
  text-wrap: balance;
}
.fields {
  margin-top: 18px;
  color: #5b6470;
  font-size: 21px;
  line-height: 1.45;
}
.url {
  margin-top: 40px;
  color: #17324d;
  font-size: 18px;
  font-weight: 600;
}
</style>
</head>
<body>
  <img class="photo" src="share-card-photo.jpg" alt="">
  <div class="panel">
    <p class="kicker">University of Haifa</p>
    <h1>Ami Pedahzur</h1>
    <div class="rule"></div>
    <p class="subtitle">Political Violence, Warfare &amp; Strategy</p>
    <p class="fields">Terrorism · Special Operations Forces<br>Research Methods · Counterterrorism</p>
    <p class="url">pedahzur.github.io/A.M.Pedahzur</p>
  </div>
</body>
</html>
